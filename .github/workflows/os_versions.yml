name: OS versions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
    contents: read

jobs:
  os-tests:
    strategy:
        fail-fast: false
        matrix:
            chosen-os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.chosen-os }}

    steps:
      - uses: actions/checkout@v7
        with:
            persist-credentials: false

      - name: Set up Python "3.14"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install .[dev]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Test with pytest
        run: |
          pytest
