name: Daily weather forecast

on:
  push:
    branches: ["felix"]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-weather-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check model release configuration
        env:
          MODEL_RELEASE: ${{ vars.WEATHER_MODEL_RELEASE }}
        run: |
          if [[ -z "$MODEL_RELEASE" ]]; then
            echo "::error::Set the WEATHER_MODEL_RELEASE repository Actions variable to a published model release tag."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install workflow dependencies
        run: python -m pip install '.[workflow]'

      - name: Resolve forecast date and paths
        id: forecast
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import yaml

          settings = yaml.safe_load(Path("examples/config.yaml").read_text())
          live = settings["live_forecast"]
          # Capture the London date once, even if a later step crosses midnight.
          forecast_date = datetime.now(ZoneInfo("Europe/London")).date()
          live["forecast_date"] = forecast_date.isoformat()
          output_dir = Path(live["output_dir"])
          output_dir.mkdir(parents=True, exist_ok=True)
          Path(live["model_path"]).parent.mkdir(parents=True, exist_ok=True)
          config_file = output_dir / "run-config.json"
          config_file.write_text(json.dumps(settings))
          values = {
              "config_file": str(config_file),
              "model_path": live["model_path"],
              "csv": str(output_dir / f"oxford_weather_forecast_{forecast_date}.csv"),
              "first_date": forecast_date.isoformat(),
              "last_date": (forecast_date + timedelta(days=6)).isoformat(),
              "artifact": f"oxford-weather-{forecast_date}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Download trained model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODEL_RELEASE: ${{ vars.WEATHER_MODEL_RELEASE }}
          MODEL_PATH: ${{ steps.forecast.outputs.model_path }}
        run: |
          if ! gh release download "$MODEL_RELEASE" --pattern oxford_weather_model.pt --output "$MODEL_PATH"; then
            echo "::error::Could not download oxford_weather_model.pt. Check WEATHER_MODEL_RELEASE and the release asset."
            exit 1
          fi
          test -s "$MODEL_PATH"

      - name: Generate seven-day forecast
        env:
          RUN_CONFIG: ${{ steps.forecast.outputs.config_file }}
        run: python -m snakemake --cores 1 --show-failed-logs --configfile "$RUN_CONFIG" -- live_forecast

      - name: Upload forecast CSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.forecast.outputs.artifact }}
          path: ${{ steps.forecast.outputs.csv }}
          if-no-files-found: error
          retention-days: 90

      - name: Summarize forecast
        env:
          FIRST_DATE: ${{ steps.forecast.outputs.first_date }}
          LAST_DATE: ${{ steps.forecast.outputs.last_date }}
          MODEL_RELEASE: ${{ vars.WEATHER_MODEL_RELEASE }}
          ARTIFACT: ${{ steps.forecast.outputs.artifact }}
          CSV_PATH: ${{ steps.forecast.outputs.csv }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from pathlib import Path

          generated = datetime.fromtimestamp(Path(os.environ["CSV_PATH"]).stat().st_mtime, timezone.utc).isoformat()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  "## Oxford weather forecast\n\n"
                  f"Forecast dates: {os.environ['FIRST_DATE']} to {os.environ['LAST_DATE']}\n\n"
                  f"Generated at (UTC): {generated}\n\n"
                  f"Model release: `{os.environ['MODEL_RELEASE']}`\n\n"
                  f"Code commit: `{os.environ['GITHUB_SHA']}`\n\n"
                  f"Download artifact: `{os.environ['ARTIFACT']}` (90-day retention)\n"
              )
          PY
