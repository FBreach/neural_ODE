name: Daily weather forecast

on:
  push:
    branches: ["felix"]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install workflow dependencies
        run: python -m pip install '.[workflow]'
      - name: Generate seven-day forecast
        run: python -m snakemake --cores 1 --show-failed-logs live_forecast
      - name: Upload forecast CSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oxford-weather-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/live/oxford_weather_forecast_*.csv
          if-no-files-found: error
          retention-days: 90
