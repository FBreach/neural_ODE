<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Oxford weather workflow</title>
  <desc id="desc">Fetch weather, gather chronological splits, train, evaluate and plot. The all target collects evaluation and plots.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <g fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)">
    <path d="M210 62 V100"/>
    <path d="M210 142 V180"/>
    <path d="M135 121 H35 V265 H100 V300"/>
    <path d="M285 121 H385 V265 H320 V300"/>
    <path d="M175 222 V250 H100 V300"/>
    <path d="M245 222 V250 H320 V300"/>
    <path d="M100 342 V375 H175 V400"/>
    <path d="M320 342 V375 H245 V400"/>
  </g>
  <g stroke="#555" stroke-width="1.5">
    <rect x="135" y="20" width="150" height="42" rx="5" fill="#BFA3E0"/>
    <rect x="135" y="100" width="150" height="42" rx="5" fill="#8BD957"/>
    <rect x="135" y="180" width="150" height="42" rx="5" fill="#57BFD9"/>
    <rect x="40" y="300" width="120" height="42" rx="5" fill="#D9BF57"/>
    <rect x="260" y="300" width="120" height="42" rx="5" fill="#57D98B"/>
    <rect x="150" y="400" width="120" height="42" rx="5" fill="#D95757"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#222" text-anchor="middle" dominant-baseline="middle">
    <text x="210" y="41">fetch_weather</text>
    <text x="210" y="121">gather_data</text>
    <text x="210" y="201">train</text>
    <text x="100" y="321">evaluate</text>
    <text x="320" y="321">plot</text>
    <text x="210" y="421">all</text>
  </g>
</svg>
