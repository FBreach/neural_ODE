[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-ode"
version = "0.1.0"
description = "Neural ODE forecasting and latent trajectory clustering"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
#   "torchdiffeq>=0.2.3",
  "ipykernel"
]

[project.optional-dependencies]
workflow = [
  "snakemake>=9,<10",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff"
]
docs = [
  "sphinx>=8.2,<9",
  "sphinx-rtd-theme>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neural_ode*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F"]
